  <ellipse cx="1040" cy="30" rx="430" ry="300" fill="url(#glow)"/>

  <text x="1128" y="212" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="190" font-weight="700" letter-spacing="-10" fill="#FFFFFF" fill-opacity="0.035">FB</text>

  <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="4" fill="#A78BFA">MENDOZA · ARGENTINA</text>

